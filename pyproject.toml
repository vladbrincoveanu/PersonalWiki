[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".worktrees",
    ".venv",
    "docs",
    "tests",
    "scripts",
    "vault/tests",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"core/mcp_server.py" = ["E402"]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/scripts/tests/*",
    "*/docs/*",
]

[tool.coverage.report]
show_missing = true
