services:
  personalwiki:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ${VAULT_PATH:-/Users/vladbrincoveanu/Library/Mobile Documents/iCloud~md~obsidian/Documents/PersonalWiki}:/vault
    env_file:
      - .env
    environment:
      - VAULT_PATH=/vault
      - INDEX_PATH=/app/.vke_index
      - YOUTUBE_PROXY=  # intentionally empty — NordVPN HTTP Proxy requires paid add-on
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
