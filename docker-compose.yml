services:
  personalwiki:
    build: .
    ports:
      - "8010:8000"
    volumes:
      - ${VAULT_PATH:-./.vault}:/vault
    env_file:
      - path: .env
        required: false
    environment:
      VAULT_PATH: /vault
      INDEX_PATH: /app/.vke_index
      YOUTUBE_PROXY: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
