<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKE Local</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 560px;
            padding: 2rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #fff;
            letter-spacing: -0.02em;
        }
        h1 span { color: #6366f1; }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input[type="url"], input[type="file"] {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            color: #e5e5e5;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus { border-color: #6366f1; }
        button[type="submit"] {
            margin-top: 1rem;
            width: 100%;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #4f46e5; }
        .divider {
            text-align: center;
            color: #444;
            font-size: 0.8rem;
            margin: 0.5rem 0;
        }
        #progress {
            margin-top: 1rem;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.85rem;
            line-height: 1.8;
            min-height: 2rem;
            display: none;
        }
        #progress p { color: #ccc; }
        #progress p:last-child { color: #a3e635; }
        .htmx-request #progress { display: block; }
        #progress:not(:empty) { display: block; }

        /* Keywords panel */
        #keywords-panel {
            margin-top: 1rem;
        }
        #keywords-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            padding: 0.5rem 0;
        }
        #keywords-header h2 {
            font-size: 0.9rem;
            font-weight: 500;
            color: #888;
        }
        #keywords-toggle {
            font-size: 0.75rem;
            color: #555;
            transition: transform 0.2s;
        }
        #keywords-body {
            display: none;
        }
        #keywords-body.open { display: block; }
        #keywords-toggle.open { transform: rotate(90deg); }

        #keywords-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            min-height: 2rem;
        }
        .kw-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 20px;
            padding: 0.25rem 0.6rem;
            font-size: 0.78rem;
            color: #ccc;
        }
        .kw-chip.auto { background: #1e2a1e; border-color: #2a3a2a; color: #9ecf9e; }
        .kw-chip button {
            background: none;
            border: none;
            color: #6366f1;
            cursor: pointer;
            font-size: 0.75rem;
            line-height: 1;
            padding: 0;
            margin-left: 0.1rem;
        }
        .kw-chip button:hover { color: #f87171; }

        #add-keyword-form {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }
        #add-keyword-input {
            flex: 1;
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 0.4rem 0.7rem;
            color: #e5e5e5;
            font-size: 0.85rem;
            outline: none;
        }
        #add-keyword-input:focus { border-color: #6366f1; }
        #add-keyword-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #888;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 0.4rem 0.7rem;
            transition: all 0.2s;
        }
        #add-keyword-btn:hover { border-color: #6366f1; color: #6366f1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VKE <span>Local</span></h1>

        <form hx-post="/ingest"
              hx-target="#progress"
              hx-swap="innerHTML"
              enctype="multipart/form-data">

            <div class="card">
                <label>URL</label>
                <input type="url" name="url" placeholder="https://arxiv.org/abs/..." />
            </div>

            <div class="divider">or</div>

            <div class="card">
                <label>PDF File</label>
                <input type="file" name="file" accept=".pdf" />
            </div>

            <button type="submit">Ingest</button>
        </form>

        <div id="progress"></div>

        <div id="keywords-panel">
            <div id="keywords-header" onclick="toggleKeywords()">
                <h2>Keywords (<span id="kw-count">0</span>)</h2>
                <span id="keywords-toggle" class="open">▶</span>
            </div>
            <div id="keywords-body" class="open">
                <div id="keywords-chips"></div>
                <form id="add-keyword-form" onsubmit="return false;">
                    <input id="add-keyword-input" type="text" placeholder="Add a keyword..." />
                    <button id="add-keyword-btn" type="button" onclick="addKeyword()">+ Add</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleKeywords() {
            const body = document.getElementById('keywords-body');
            const toggle = document.getElementById('keywords-toggle');
            body.classList.toggle('open');
            toggle.classList.toggle('open');
        }

        async function loadKeywords() {
            try {
                const res = await fetch('/keywords');
                const data = await res.json();
                const chips = document.getElementById('keywords-chips');
                chips.innerHTML = '';

                const all = [...data.manual, ...data.graph];
                data.manual.forEach(kw => {
                    chips.appendChild(makeChip(kw, true));
                });
                data.graph.forEach(kw => {
                    chips.appendChild(makeChip(kw, false));
                });

                document.getElementById('kw-count').textContent = data.total;
            } catch (e) {
                console.error('Failed to load keywords', e);
            }
        }

        function makeChip(kw, isManual) {
            const span = document.createElement('span');
            span.className = 'kw-chip' + (isManual ? '' : ' auto');
            span.textContent = kw;
            if (isManual) {
                const btn = document.createElement('button');
                btn.textContent = '✕';
                btn.title = 'Remove keyword';
                btn.onclick = () => removeKeyword(kw);
                span.appendChild(btn);
            }
            return span;
        }

        async function addKeyword() {
            const input = document.getElementById('add-keyword-input');
            const kw = input.value.trim();
            if (!kw) return;
            try {
                const res = await fetch('/keywords/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'keyword=' + encodeURIComponent(kw)
                });
                input.value = '';
                if (res.ok) {
                    loadKeywords();
                }
            } catch (e) {
                console.error('Failed to add keyword', e);
            }
        }

        async function removeKeyword(kw) {
            if (!confirm('Remove keyword "' + kw + '"? This may trigger auto-purge.')) return;
            try {
                const res = await fetch('/keywords/remove', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'keyword=' + encodeURIComponent(kw)
                });
                if (res.ok) loadKeywords();
            } catch (e) {
                console.error('Failed to remove keyword', e);
            }
        }

        loadKeywords();
    </script>
</body>
</html>
