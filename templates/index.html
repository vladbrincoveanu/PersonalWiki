<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKE Local</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e5e5e5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 560px;
            padding: 2rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #fff;
            letter-spacing: -0.02em;
        }
        h1 span { color: #6366f1; }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input[type="url"], input[type="file"] {
            width: 100%;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 0.7rem 1rem;
            color: #e5e5e5;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="url"]:focus { border-color: #6366f1; }
        button[type="submit"] {
            margin-top: 1rem;
            width: 100%;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        button[type="submit"]:hover { background: #4f46e5; }
        .divider {
            text-align: center;
            color: #444;
            font-size: 0.8rem;
            margin: 0.5rem 0;
        }
        #progress {
            margin-top: 1rem;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 1rem;
            font-size: 0.85rem;
            line-height: 1.8;
            min-height: 2rem;
            display: none;
        }
        #progress p { color: #ccc; }
        #progress p:last-child { color: #a3e635; }
        .htmx-request #progress { display: block; }
        #progress:not(:empty) { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>VKE <span>Local</span></h1>

        <form hx-post="/ingest"
              hx-target="#progress"
              hx-swap="innerHTML"
              enctype="multipart/form-data">

            <div class="card">
                <label>URL</label>
                <input type="url" name="url" placeholder="https://arxiv.org/abs/..." />
            </div>

            <div class="divider">or</div>

            <div class="card">
                <label>PDF File</label>
                <input type="file" name="file" accept=".pdf" />
            </div>

            <button type="submit">Ingest</button>
        </form>

        <div id="progress"></div>
    </div>
</body>
</html>
