<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personalWiki</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #020617;
            --surface: #0f172a;
            --surface-2: #1e293b;
            --surface-3: #2d3a4f;
            --border: #334155;
            --border-bright: #475569;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --accent-dim: #166534;
            --accent-glow: rgba(34, 197, 94, 0.15);
            --danger: #ef4444;
            --danger-dim: #7f1d1d;
            --warning: #f59e0b;
            --info: #38bdf8;
            --info-dim: #0c4a6e;
            --radius: 12px;
            --radius-sm: 8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Typography ── */
        .mono { font-family: 'Space Mono', 'Fira Code', monospace; }

        /* ── Layout ── */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 2rem 1.25rem 4rem;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .logo-icon svg { width: 20px; height: 20px; color: #000; }
        .logo-text {
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .logo-text span { color: var(--accent); }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Space Mono', monospace;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--accent); }
            50% { opacity: 0.5; box-shadow: 0 0 4px var(--accent); }
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            transition: border-color 0.2s;
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }
        .card-header svg { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; }
        .card-title {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        /* ── Ingest Card ── */
        .ingest-card { margin-bottom: 1rem; }

        .url-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .url-row input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.75rem 1rem;
            color: var(--text);
            font-size: 0.875rem;
            font-family: 'Space Mono', monospace;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .url-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .url-row input::placeholder {
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }

        .file-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            background: var(--bg);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .file-row:hover {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.03);
        }
        .file-row svg { width: 18px; height: 18px; color: var(--text-dim); flex-shrink: 0; transition: color 0.2s; }
        .file-row:hover svg { color: var(--accent); }
        .file-row.drag-over {
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.08);
            border-style: solid;
        }
        .file-row.has-file {
            border-color: var(--accent-dim);
            border-style: solid;
        }
        .file-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }
        .file-row:hover .file-label { color: var(--text); }
        .file-row input[type="file"] { display: none; }
        .selected-file {
            font-size: 0.8rem;
            font-family: 'Space Mono', monospace;
            color: var(--accent);
            margin-left: 0.25rem;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: none;
        }
        .selected-file.visible { display: inline; }
        .file-types {
            margin-left: auto;
            display: flex;
            gap: 0.35rem;
        }
        .file-type-badge {
            font-size: 0.65rem;
            font-family: 'Space Mono', monospace;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            background: var(--surface-2);
            color: var(--text-dim);
            border: 1px solid var(--border);
        }

        .btn-ingest {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: var(--radius-sm);
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .btn-ingest svg { width: 16px; height: 16px; }
        .btn-ingest:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .btn-ingest:active { transform: scale(0.97); }
        .btn-ingest:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ── Progress Card ── */
        .progress-card {
            margin-bottom: 1rem;
            display: none;
        }
        .progress-card.active { display: block; }

        #source-badge {
            display: none;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            font-family: 'Space Mono', monospace;
            width: fit-content;
            animation: fadeIn 0.2s ease;
        }
        #source-badge.visible { display: flex; }
        #source-badge.url { background: var(--info-dim); color: var(--info); border: 1px solid #1e3a5f; }
        #source-badge.pdf { background: var(--danger-dim); color: var(--danger); border: 1px solid #7f1d1d; }
        #source-badge.docx { background: #1e3b4f; color: #38bdf8; border: 1px solid #0c4a6e; }
        #source-badge.md { background: #1f3b2e; color: #4ade80; border: 1px solid #14532d; }
        #source-badge.txt { background: #3b3b1f; color: #facc15; border: 1px solid #713f12; }
        #source-badge svg { width: 14px; height: 14px; flex-shrink: 0; }

        #progress-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            min-height: 64px;
            max-height: 180px;
            overflow-y: auto;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            line-height: 1.9;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        #progress-box::-webkit-scrollbar { width: 6px; }
        #progress-box::-webkit-scrollbar-track { background: transparent; }
        #progress-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        #progress-box p { color: var(--text-muted); margin: 0; }
        #progress-box p:last-child { color: var(--accent); font-weight: 600; }
        #progress-box .err { color: var(--danger); }
        #progress-box .warn { color: var(--warning); }
        #progress-box .success { color: var(--accent); font-weight: 600; }
        #note-preview {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        #note-preview h1, #note-preview h2, #note-preview h3 {
            margin-top: 0.5em;
        }
        #note-preview pre {
            overflow-x: auto;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Two-Column Grid ── */
        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 580px) {
            .two-col { grid-template-columns: 1fr; }
            .container { padding: 1.25rem 1rem 3rem; }
        }

        /* ── Keywords ── */
        #keywords-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            min-height: 2rem;
        }
        .kw-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.25rem 0.5rem 0.25rem 0.7rem;
            font-size: 0.72rem;
            color: var(--text-muted);
            transition: border-color 0.15s, color 0.15s;
            cursor: default;
        }
        .kw-chip:hover {
            border-color: var(--border-bright);
            color: var(--text);
        }
        .kw-chip.graph {
            color: var(--info);
            border-color: var(--info-dim);
            background: rgba(56, 189, 248, 0.06);
        }
        .kw-chip.graph:hover { border-color: var(--info); }
        .kw-chip button {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.65rem;
            line-height: 1;
            padding: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }
        .kw-chip button:hover { background: var(--danger); color: #fff; }
        .kw-empty { font-size: 0.8rem; color: var(--text-dim); padding: 0.5rem 0; text-align: center; }

        /* ── Jobs ── */
        #jobs-list {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-height: 2rem;
        }
        .job-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.55rem 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.75rem;
            cursor: pointer;
            transition: border-color 0.15s;
        }
        .job-item:hover { border-color: var(--border-bright); }
        .job-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .job-dot.done { background: var(--accent); box-shadow: 0 0 4px var(--accent); }
        .job-dot.running { background: var(--warning); animation: pulse 0.8s ease-in-out infinite; }
        .job-dot.queued { background: var(--text-dim); }
        .job-dot.err { background: var(--danger); }
        .job-url {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'Space Mono', monospace;
            color: var(--text-muted);
            font-size: 0.7rem;
        }
        .job-status { font-size: 0.68rem; color: var(--text-dim); white-space: nowrap; font-family: 'Space Mono', monospace; }
        .job-delete {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
        }
        .job-item:hover .job-delete { opacity: 1; }
        .job-delete:hover { color: var(--danger); }
        .no-jobs { font-size: 0.8rem; color: var(--text-dim); text-align: center; padding: 1.25rem 0; }

        /* ── Ping ── */
        .ping-line {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            padding: 0.25rem 0;
            border-top: 1px solid var(--border);
            margin-top: 0.5rem;
        }

        /* ── Scrollbar ── */
        ::selection { background: var(--accent-dim); color: var(--text); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-bright); }

        /* Discovery panel */
        .discovery-panel {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          padding: 1rem;
          margin-top: 1rem;
        }

        .discovery-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 0.75rem;
        }

        .discovery-header h3 {
          font-size: 0.9rem;
          font-weight: 600;
          color: var(--text);
        }

        .refresh-btn {
          background: var(--surface-2);
          border: 1px solid var(--border);
          border-radius: var(--radius-sm);
          color: var(--text-muted);
          cursor: pointer;
          font-size: 0.9rem;
          padding: 0.25rem 0.5rem;
          transition: border-color 0.15s, color 0.15s;
        }
        .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

        .discovery-stats {
          display: flex;
          gap: 1rem;
          font-size: 0.75rem;
          color: var(--text-muted);
          margin-bottom: 0.75rem;
          padding-bottom: 0.75rem;
          border-bottom: 1px solid var(--border);
        }

        .discovery-stat {
          display: flex;
          align-items: center;
          gap: 0.25rem;
        }

        .discovery-stat .num {
          color: var(--text);
          font-weight: 600;
        }

        .discovery-feed {
          max-height: 300px;
          overflow-y: auto;
        }

        .discovery-item {
          display: flex;
          align-items: flex-start;
          gap: 0.5rem;
          padding: 0.4rem 0;
          border-bottom: 1px solid var(--surface-2);
          font-size: 0.8rem;
        }

        .discovery-item:last-child {
          border-bottom: none;
        }

        .discovery-badge {
          flex-shrink: 0;
          font-size: 0.7rem;
          padding: 0.1rem 0.3rem;
          border-radius: 4px;
          font-weight: 600;
        }

        .badge-ingested { background: var(--accent-dim); color: var(--accent); }
        .badge-failed { background: var(--danger-dim); color: var(--danger); }
        .badge-pending { background: var(--surface-3); color: var(--text-muted); }

        .discovery-item-content {
          flex: 1;
          min-width: 0;
        }

        .discovery-item-title {
          color: var(--text);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          display: block;
        }

        .discovery-item-domain {
          color: var(--text-dim);
          font-size: 0.7rem;
        }

        .discovery-empty {
          color: var(--text-dim);
          font-size: 0.8rem;
          text-align: center;
          padding: 1rem;
        }

        /* ── Keyword Preview ── */
        #keyword-preview {
          display: none;
          margin-bottom: 1rem;
        }
        #keyword-preview.visible { display: block; }
        #keyword-chips {
          display: flex;
          flex-wrap: wrap;
          gap: 0.4rem;
          min-height: 2rem;
          margin-top: 0.75rem;
        }
        .kw-chip.existing {
          border-color: var(--accent-dim);
          color: var(--accent);
          background: rgba(34, 197, 94, 0.06);
        }
        .kw-chip.new {
          border-color: var(--info-dim);
          background: rgba(56, 189, 248, 0.06);
        }
        #confirm-btn { flex: 1; }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <header>
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <polyline points="10 9 9 9 8 9"/>
                </svg>
            </div>
            <span class="logo-text">personal<span>Wiki</span></span>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span class="mono">live</span>
        </div>
    </header>

    <!-- Ingest Form -->
    <div class="card ingest-card">
        <div class="card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            <span class="card-title">Ingest</span>
        </div>
        <form id="ingest-form" action="/ingest/preview" method="post" enctype="multipart/form-data">
            <div class="url-row">
                <input
                    type="url"
                    name="url"
                    placeholder="https://arxiv.org/abs/... or any URL"
                    autocomplete="off"
                    autofocus
                />
                <button type="submit" class="btn-ingest" id="ingest-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                    Ingest
                </button>
            </div>
            <label class="file-row" for="file-input" id="file-row-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span class="file-label" id="file-label-text">Drop a file here or click to browse</span>
                <span id="selected-file" class="selected-file"></span>
                <div class="file-types">
                    <span class="file-type-badge">PDF</span>
                    <span class="file-type-badge">DOCX</span>
                    <span class="file-type-badge">MD</span>
                    <span class="file-type-badge">TXT</span>
                </div>
            </label>
            <input type="file" id="file-input" name="file" accept=".pdf,.docx,.md,.txt" style="display:none" />
        </form>
    </div>

    <!-- Discovery Panel -->
    <div id="discovery-panel" class="discovery-panel">
      <div class="discovery-header">
        <h3>Discovery</h3>
        <div>
          <button onclick="triggerDiscovery()" class="refresh-btn" title="Run discovery now" style="margin-right:0.5rem;">▶ Run</button>
          <button onclick="loadDiscoveryActivity()" class="refresh-btn" title="Refresh">↻</button>
        </div>
      </div>
      <div id="discovery-stats" class="discovery-stats">
        <span>—</span>
      </div>
      <div id="discovery-feed" class="discovery-feed">
        <div class="discovery-empty">No discovery activity today.</div>
      </div>
    </div>

    <!-- Keyword Preview (two-phase ingest phase 1) -->
    <div id="keyword-preview" class="card">
        <div class="card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                <line x1="7" y1="7" x2="7.01" y2="7"/>
            </svg>
            <span class="card-title">Extracted Keywords</span>
        </div>
        <div id="keyword-chips"></div>
        <p style="font-size:0.75rem;color:var(--text-dim);margin-top:0.5rem;">
            <span style="color:var(--accent);">●</span> Existing &nbsp;
            <span style="color:var(--info);">●</span> New (check to add)
        </p>
        <div style="display:flex;gap:0.5rem;margin-top:1rem;">
            <button id="confirm-btn" class="btn-ingest" onclick="confirmIngest()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                Confirm & Save
            </button>
            <button id="cancel-btn" onclick="cancelIngest()" style="background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);border-radius:var(--radius-sm);padding:0.75rem 1.5rem;cursor:pointer;">
                Cancel
            </button>
        </div>
    </div>

    <!-- Progress -->
    <div class="card progress-card" id="progress-card">
        <div class="card-header">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <span class="card-title">Live Progress</span>
        </div>
        <div id="source-badge"></div>
        <div id="progress-box"></div>
        <div id="note-preview" style="display:none;"></div>
    </div>

    <!-- Two Column: Keywords + Jobs -->
    <div class="two-col">
        <!-- Keywords -->
        <div class="card">
            <div class="card-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
                    <line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
                <span class="card-title">Keywords</span>
            </div>
            <div id="keywords-chips"></div>
        </div>

        <!-- Recent Jobs -->
        <div class="card">
            <div class="card-header">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <span class="card-title">Recent Jobs</span>
            </div>
            <div id="jobs-list">
                <div class="no-jobs">No jobs yet — ingest something</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ── Keywords ──────────────────────────────────────────────
    async function loadKeywords() {
        try {
            const res = await fetch('/keywords');
            const data = await res.json();
            const chips = document.getElementById('keywords-chips');
            chips.innerHTML = '';
            const kws = data.keywords || [];
            if (kws.length === 0) {
                chips.innerHTML = '<div class="kw-empty">No keywords yet</div>';
                return;
            }
            kws.forEach(kw => chips.appendChild(makeChip(kw)));
        } catch(e) { console.error('Failed to load keywords', e); }
    }

    function makeChip(kw) {
        const span = document.createElement('span');
        span.className = 'kw-chip';
        const txt = document.createTextNode(kw);
        span.appendChild(txt);
        const btn = document.createElement('button');
        btn.className = 'kw-remove';
        btn.textContent = '\u00d7';
        btn.onclick = (e) => { e.stopPropagation(); removeKeyword(kw); };
        span.appendChild(btn);
        return span;
    }

    async function removeKeyword(kw) {
        if (!confirm('Remove keyword "' + kw + '"?\n\nThis will delete all discovery articles tagged with this keyword.')) return;
        try {
            const res = await fetch('/keywords/remove', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ keyword: kw })
            });
            if (res.ok) loadKeywords();
        } catch(e) { console.error('Failed to remove keyword', e); }
    }

    // ── File Input & Drag-and-Drop ───────────────────────────
    const fileInput = document.getElementById('file-input');
    const fileRow = document.getElementById('file-row-label');
    const selectedFileSpan = document.getElementById('selected-file');
    const fileLabelText = document.getElementById('file-label-text');

    // Show selected filename
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            const name = fileInput.files[0].name;
            selectedFileSpan.textContent = name;
            selectedFileSpan.classList.add('visible');
            fileLabelText.style.display = 'none';
            fileRow.classList.add('has-file');
        } else {
            selectedFileSpan.textContent = '';
            selectedFileSpan.classList.remove('visible');
            fileLabelText.style.display = '';
            fileRow.classList.remove('has-file');
        }
    });

    // Drag and drop
    fileRow.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileRow.classList.add('drag-over');
    });
    fileRow.addEventListener('dragleave', () => {
        fileRow.classList.remove('drag-over');
    });
    fileRow.addEventListener('drop', (e) => {
        e.preventDefault();
        fileRow.classList.remove('drag-over');
        const files = e.dataTransfer.files;
        if (files.length > 0) {
            // Create a new FileList-like object by directly setting files on the input
            const dt = new DataTransfer();
            for (const f of files) dt.items.add(f);
            fileInput.files = dt.files;
            fileInput.dispatchEvent(new Event('change'));
        }
    });

    // ── Form Submit ──────────────────────────────────────────
    let activeSource = null;

    const SOURCE_ICONS = {
        url: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
        pdf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
        docx: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
        md: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`,
        txt: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`,
    };

    function setSourceBadge(sourceType, label) {
        const badge = document.getElementById('source-badge');
        badge.className = sourceType + ' visible';
        badge.innerHTML = SOURCE_ICONS[sourceType] + '<span>' + label + '</span>';
        document.getElementById('progress-card').classList.add('active');
    }

    function clearSourceBadge() {
        const badge = document.getElementById('source-badge');
        badge.className = '';
        badge.style.display = 'none';
        badge.innerHTML = '';
        setTimeout(() => {
            if (!badge.classList.contains('visible')) {
                document.getElementById('progress-card').classList.remove('active');
            }
        }, 2000);
    }

    document.getElementById('ingest-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('ingest-btn');
        const box = document.getElementById('progress-box');
        const progressCard = document.getElementById('progress-card');
        const preview = document.getElementById('note-preview');
        preview.style.display = 'none';
        preview.innerHTML = '';

        const urlInput = document.querySelector('input[name="url"]');
        const fileInput = document.querySelector('input[name="file"]');

        let sourceType = 'url';
        let sourceLabel = '';
        if (urlInput && urlInput.value.trim()) {
            try {
                const u = new URL(urlInput.value.trim());
                sourceLabel = u.hostname.replace('www.', '');
            } catch {
                sourceLabel = urlInput.value.trim().substring(0, 35);
            }
        } else if (fileInput && fileInput.files.length > 0) {
            const fname = fileInput.files[0].name.toLowerCase();
            if (fname.endsWith('.pdf')) { sourceType = 'pdf'; sourceLabel = 'PDF document'; }
            else if (fname.endsWith('.docx') || fname.endsWith('.doc')) { sourceType = 'docx'; sourceLabel = 'Word document'; }
            else if (fname.endsWith('.md') || fname.endsWith('.markdown')) { sourceType = 'md'; sourceLabel = 'Markdown'; }
            else { sourceType = 'txt'; sourceLabel = 'Text file'; }
        }

        btn.disabled = true;
        btn.innerHTML = 'Extracting...';

        const formData = new FormData(e.target);
        try {
            const res = await fetch('/ingest/preview', { method: 'POST', body: formData });
            if (!res.ok) {
                const err = await res.text();
                progressCard.classList.add('active');
                box.innerHTML = '<p class="err">Preview failed: ' + err + '</p>';
                btn.disabled = false;
                btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Ingest';
                return;
            }
            const data = await res.json();
            showKeywordPreview(data);
            setSourceBadge(sourceType, sourceLabel);
        } catch(err) {
            progressCard.classList.add('active');
            box.innerHTML = '<p class="err">Error: ' + err.message + '</p>';
            btn.disabled = false;
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Ingest';
        }
    });

    let _previewData = null;

    function showKeywordPreview(data) {
        _previewData = data;
        const container = document.getElementById('keyword-preview');
        const chips = document.getElementById('keyword-chips');
        chips.innerHTML = '';
        container.classList.add('visible');
        container.scrollIntoView({ behavior: 'smooth' });

        document.getElementById('ingest-btn').style.display = 'none';

        const allKeywords = [
            ...(data.keywords.existing || []).map(k => ({ kw: k, existing: true })),
            ...(data.keywords.new || []).map(k => ({ kw: k, existing: false })),
        ];

        allKeywords.forEach(({ kw, existing }) => {
            const chip = document.createElement('span');
            chip.className = 'kw-chip' + (existing ? ' existing' : ' new');

            if (!existing) {
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = true;
                checkbox.dataset.keyword = kw;
                checkbox.style.marginRight = '0.25rem';
                checkbox.style.accentColor = 'var(--info)';
                chip.appendChild(checkbox);
            } else {
                const check = document.createElement('span');
                check.textContent = ' ✓';
                check.style.color = 'var(--accent)';
                check.style.fontSize = '0.65rem';
                chip.appendChild(check);
                const space = document.createTextNode(' ');
                chip.appendChild(space);
            }

            const txt = document.createTextNode(kw);
            chip.appendChild(txt);
            chips.appendChild(chip);
        });
    }

    async function confirmIngest() {
        if (!_previewData) return;
        const previewId = _previewData.preview_id;
        const checkboxes = document.querySelectorAll('#keyword-chips input[type="checkbox"]:checked');
        const acceptedKeywords = Array.from(checkboxes).map(cb => cb.dataset.keyword);

        const payload = {
            preview_id: previewId,
            accepted_keywords: acceptedKeywords,
            url: _previewData.url || null,
        };

        document.getElementById('keyword-preview').classList.remove('visible');
        const progressCard = document.getElementById('progress-card');
        const box = document.getElementById('progress-box');
        progressCard.classList.add('active');
        box.innerHTML = '<p>Starting pipeline...</p>';

        try {
            const res = await fetch('/ingest/run', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            });
            const data = await res.json();
            if (!data.job_id) throw new Error('No job_id');
            startSSEStream(data.job_id, box);
        } catch(err) {
            box.innerHTML = '<p class="err">Error: ' + err.message + '</p>';
            resetIngestUI();
        }
    }

    function cancelIngest() {
        _previewData = null;
        document.getElementById('keyword-preview').classList.remove('visible');
        resetIngestUI();
    }

    function resetIngestUI() {
        const btn = document.getElementById('ingest-btn');
        if (btn) {
            btn.disabled = false;
            btn.style.display = '';
            btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Ingest';
        }
    }

    function startSSEStream(jobId, box) {
        if (activeSource) { activeSource.close(); activeSource = null; }
        activeSource = new EventSource('/stream/' + jobId);
        activeSource.onmessage = (evt) => {
            if (evt.data === '[FINAL]') {
                activeSource.close();
                activeSource = null;
                handleStreamComplete(box);
                return;
            }
            if (evt.data.includes('ping -')) return;
            let data = evt.data;
            if (data.includes('Warning:') || data.includes('warning:')) {
                data = data.replace(/<p>/, '<p class="warn">');
            } else if (data.includes('Error:') || data.includes('error:') || data.includes('Skipped:')) {
                data = data.replace(/<p>/, '<p class="err">');
            } else if (data.includes('Saved ->')) {
                data = data.replace(/<p>/, '<p class="success">');
            }
            box.innerHTML += data;
            box.scrollTop = box.scrollHeight;
        };
        activeSource.onerror = () => {
            activeSource.close();
            activeSource = null;
            resetIngestUI();
            box.innerHTML += '<p class="err">Connection lost</p>';
        };
    }

    function handleStreamComplete(box) {
        const savedLine = Array.from(box.querySelectorAll('p')).find(p => p.textContent.includes('Saved ->'));
        if (savedLine) {
            const match = savedLine.textContent.match(/Saved -> notes\/(.+)/);
            if (match) {
                const slug = match[1];
                fetch('/note/' + slug)
                    .then(r => r.json())
                    .then(data => {
                        const preview = document.getElementById('note-preview');
                        preview.innerHTML = '<div style="color:var(--accent);font-weight:600;margin-bottom:0.5rem;">Saved Note</div>' + data.content.replace(/\n/g, '<br>');
                        preview.style.display = 'block';
                    })
                    .catch(() => {});
            }
        }
        if (!box.textContent.includes('Saved ->')) {
            box.innerHTML += '<p class="warn">Finished (check vault)</p>';
        } else {
            box.innerHTML += '<p class="success">Done!</p>';
        }
        resetIngestUI();
        setTimeout(clearSourceBadge, 3000);
    }

    async function triggerDiscovery() {
        try {
            const res = await fetch('/discovery/trigger', { method: 'POST' });
            if (res.ok) {
                setTimeout(loadDiscoveryActivity, 2000);
            }
        } catch(e) {
            console.warn('Discovery trigger failed:', e);
        }
    }

    // ── Discovery ─────────────────────────────────────────────
    async function loadDiscoveryActivity() {
      try {
        const res = await fetch('/api/discovery/activity');
        if (!res.ok) return;
        const data = await res.json();
        renderDiscoveryActivity(data);
      } catch (e) {
        console.warn('Discovery activity load failed:', e);
      }
    }

    function renderDiscoveryActivity(data) {
      const stats = data.stats || {};
      const events = data.events || [];

      // Render stats
      const statsEl = document.getElementById('discovery-stats');
      if (statsEl) {
        let lastCycle = '—';
        if (stats.last_cycle_at) {
          try {
            lastCycle = new Date(stats.last_cycle_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          } catch (e) {
            lastCycle = '—';
          }
        }
        statsEl.innerHTML = '';

        const s1 = document.createElement('span');
        s1.className = 'discovery-stat';
        const n1 = document.createElement('span');
        n1.className = 'num';
        n1.textContent = stats.discovered_today || 0;
        s1.appendChild(n1);
        s1.appendChild(document.createTextNode(' today'));

        const s2 = document.createElement('span');
        s2.className = 'discovery-stat';
        const n2 = document.createElement('span');
        n2.className = 'num';
        n2.textContent = stats.queue_depth || 0;
        s2.appendChild(n2);
        s2.appendChild(document.createTextNode(' queue'));

        const s3 = document.createElement('span');
        s3.className = 'discovery-stat';
        s3.textContent = lastCycle;

        statsEl.appendChild(s1);
        statsEl.appendChild(s2);
        statsEl.appendChild(s3);
      }

      // Render feed using DOM methods (no innerHTML with user data)
      const feedEl = document.getElementById('discovery-feed');
      if (!feedEl) return;

      feedEl.innerHTML = '';
      if (events.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'discovery-empty';
        empty.textContent = 'No discovery activity today.';
        feedEl.appendChild(empty);
        return;
      }

      const reversed = events.slice().reverse();
      reversed.forEach(function(event) {
        const item = document.createElement('div');
        item.className = 'discovery-item';

        const badge = document.createElement('span');
        badge.className = 'discovery-badge';
        if (event.status === 'ingested') {
          badge.classList.add('badge-ingested');
          badge.textContent = '✅';
        } else if (event.status === 'failed') {
          badge.classList.add('badge-failed');
          badge.textContent = '❌';
        } else {
          badge.classList.add('badge-pending');
          badge.textContent = '⏳';
        }

        const content = document.createElement('div');
        content.className = 'discovery-item-content';

        const link = document.createElement('a');
        link.href = event.url || '#';
        link.target = '_blank';
        link.className = 'discovery-item-title';
        link.title = event.url || '';
        link.textContent = event.title || event.url || '';

        const domain = document.createElement('span');
        domain.className = 'discovery-item-domain';
        const sourceParts = (event.source || '').split(': ');
        domain.textContent = sourceParts[sourceParts.length - 1] || '';

        content.appendChild(link);
        content.appendChild(domain);
        item.appendChild(badge);
        item.appendChild(content);
        feedEl.appendChild(item);
      });
    }

    // ── Init ─────────────────────────────────────────────────
    loadKeywords();
    loadDiscoveryActivity();
    setInterval(loadDiscoveryActivity, 30000);
</script>
</body>
</html>
