<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personalWiki</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #020617;
            --surface: #0f172a;
            --surface-2: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #22c55e;
            --accent-dim: #166534;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Fira Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
        }

        /* ── Header ── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }
        header h1 {
            font-family: 'Fira Code', monospace;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }
        header h1 span { color: var(--accent); }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── Grid ── */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
        }

        /* ── Card ── */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .card-title svg { width: 14px; height: 14px; }

        /* ── Ingest ── */
        .ingest-card { grid-column: 1 / -1; }
        .url-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .url-row input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            color: var(--text);
            font-size: 0.875rem;
            font-family: 'Fira Code', monospace;
            outline: none;
            transition: border-color 0.2s;
        }
        .url-row input:focus { border-color: var(--accent); }
        .url-row input::placeholder { color: var(--text-muted); font-family: 'Fira Sans', sans-serif; }
        .file-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.9rem;
            background: var(--bg);
            border: 1px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .file-row:hover { border-color: var(--accent); }
        .file-row span { font-size: 0.8rem; color: var(--text-muted); }
        .file-row input[type="file"] { display: none; }
        .file-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .btn-ingest {
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .btn-ingest:hover { background: #16a34a; }
        .btn-ingest:active { transform: scale(0.97); }
        .btn-ingest:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* ── Progress ── */
        .progress-card { grid-column: 1 / -1; }
        #progress-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            min-height: 60px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.78rem;
            line-height: 1.8;
            display: none;
        }
        #progress-box:not(:empty) { display: block; }
        #progress-box p { color: var(--text-muted); margin: 0; }
        #progress-box p:last-child { color: var(--accent); }
        #progress-box .err { color: var(--danger); }

        /* ── Keywords ── */
        #keywords-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            min-height: 2rem;
        }
        .kw-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.2rem 0.5rem 0.2rem 0.65rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            transition: border-color 0.2s;
        }
        .kw-chip:hover { border-color: var(--text-muted); }
        .kw-chip.graph { color: #60a5fa; border-color: #1e3a5f; background: #0c1a2e; }
        .kw-chip button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            line-height: 1;
            padding: 0;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s;
        }
        .kw-chip button:hover { background: var(--danger); color: #fff; }
        #add-kw-row {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.6rem;
        }
        #add-kw-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.35rem 0.6rem;
            color: var(--text);
            font-size: 0.8rem;
            outline: none;
            transition: border-color 0.2s;
        }
        #add-kw-input:focus { border-color: var(--accent); }
        #add-kw-input::placeholder { color: var(--text-muted); }
        #add-kw-btn {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.8rem;
            padding: 0.35rem 0.6rem;
            transition: border-color 0.2s, color 0.2s;
        }
        #add-kw-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Jobs ── */
        #jobs-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            min-height: 2rem;
        }
        .job-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.7rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .job-item:hover { border-color: var(--text-muted); }
        .job-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .job-dot.done { background: var(--accent); }
        .job-dot.running { background: var(--warning); animation: pulse 1s ease-in-out infinite; }
        .job-dot.queued { background: var(--text-muted); }
        .job-dot.err { background: var(--danger); }
        .job-url {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: 'Fira Code', monospace;
            color: var(--text-muted);
        }
        .job-status { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
        .job-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.7rem;
            padding: 0;
            opacity: 0;
            transition: opacity 0.15s, color 0.15s;
        }
        .job-item:hover .job-delete { opacity: 1; }
        .job-delete:hover { color: var(--danger); }
        .no-jobs { font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 1rem 0; }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <header>
        <h1>personal<span>Wiki</span></h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>live</span>
        </div>
    </header>

    <!-- Ingest Form -->
    <div class="grid">
        <div class="card ingest-card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Ingest
                </div>
            </div>
            <form id="ingest-form" action="/ingest" method="post" enctype="multipart/form-data">
                <div class="url-row">
                    <input type="url" name="url" placeholder="https://arxiv.org/abs/..." autocomplete="off" />
                    <button type="submit" class="btn-ingest" id="ingest-btn">Ingest</button>
                </div>
                <label class="file-row">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span class="file-label">drop PDF here or click</span>
                    <input type="file" name="file" accept=".pdf" />
                </label>
            </form>
        </div>

        <!-- Progress -->
        <div class="card progress-card" style="grid-column:1/-1">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    Live Progress
                </div>
            </div>
            <div id="progress-box"></div>
        </div>

        <!-- Keywords -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                    Keywords (<span id="kw-count">0</span>)
                </div>
            </div>
            <div id="keywords-chips"></div>
            <div id="add-kw-row">
                <input id="add-kw-input" type="text" placeholder="Add a keyword..." />
                <button id="add-kw-btn" type="button" onclick="addKeyword()">+ Add</button>
            </div>
        </div>

        <!-- Recent Jobs -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    Recent Jobs
                </div>
            </div>
            <div id="jobs-list">
                <div class="no-jobs">No jobs yet — ingest something</div>
            </div>
        </div>
    </div>
</div>

<script>
    // ── Keywords ──────────────────────────────────────────────
    async function loadKeywords() {
        try {
            const res = await fetch('/keywords');
            const data = await res.json();
            const chips = document.getElementById('keywords-chips');
            chips.innerHTML = '';
            data.manual.forEach(kw => chips.appendChild(makeChip(kw, true)));
            data.graph.forEach(kw => chips.appendChild(makeChip(kw, false)));
            document.getElementById('kw-count').textContent = data.total;
        } catch(e) { console.error('Failed to load keywords', e); }
    }

    function makeChip(kw, isManual) {
        const span = document.createElement('span');
        span.className = 'kw-chip' + (isManual ? '' : ' graph');
        span.textContent = kw;
        const btn = document.createElement('button');
        btn.textContent = '✕';
        btn.title = 'Remove keyword';
        btn.onclick = (e) => { e.stopPropagation(); removeKeyword(kw, isManual); };
        span.appendChild(btn);
        return span;
    }

    async function addKeyword() {
        const input = document.getElementById('add-kw-input');
        const kw = input.value.trim();
        if (!kw) return;
        try {
            const res = await fetch('/keywords/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'keyword=' + encodeURIComponent(kw)
            });
            input.value = '';
            if (res.ok) loadKeywords();
            else { const e = await res.json(); alert('Error: ' + (e.detail || e.error)); }
        } catch(e) { alert('Failed: ' + e.message); }
    }

    async function removeKeyword(kw, isManual) {
        const action = isManual ? 'remove' : 'suppress';
        const msg = isManual
            ? `Remove manual keyword "${kw}"?\n\nThis will delete all vault files containing [[${kw}]].`
            : `Suppress graph keyword "${kw}"?\n\nThis will delete vault files with [[${kw}]] or #${kw} tags.\n\nKeyword will be blocklisted.`;
        if (!confirm(msg)) return;
        try {
            const endpoint = '/keywords/' + action;
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: 'keyword=' + encodeURIComponent(kw)
            });
            if (res.ok) {
                const data = await res.json();
                if (data.purged_count > 0) alert(`Removed. ${data.purged_count} file(s) deleted.`);
                loadKeywords();
            } else {
                const err = await res.text();
                alert('Failed: ' + err);
            }
        } catch(e) { alert('Failed: ' + e.message); }
    }

    document.getElementById('add-kw-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); addKeyword(); }
    });

    // ── Form submit UX ──────────────────────────────────────────
    let activeSource = null;

    document.getElementById('ingest-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('ingest-btn');
        btn.disabled = true;
        const box = document.getElementById('progress-box');
        box.style.display = 'block';
        box.innerHTML = '<p>Starting...</p>';

        // Close any existing SSE connection
        if (activeSource) { activeSource.close(); activeSource = null; }

        const form = e.target;
        const formData = new FormData(form);
        try {
            const res = await fetch(form.action, { method: 'POST', body: formData });
            const data = await res.json();
            if (!data.job_id) { box.innerHTML = '<p class="err">Failed to start job</p>'; btn.disabled = false; return; }
            const jobId = data.job_id;

            // Raw EventSource — we control when to close it
            activeSource = new EventSource('/stream/' + jobId);
            activeSource.onmessage = (evt) => {
                if (evt.data === '[FINAL]') {
                    activeSource.close();
                    activeSource = null;
                    btn.disabled = false;
                    return;
                }
                box.innerHTML += evt.data;
                box.scrollTop = box.scrollHeight;
            };
            activeSource.onerror = () => {
                activeSource.close();
                activeSource = null;
                btn.disabled = false;
            };
        } catch(err) {
            box.innerHTML = '<p class="err">Error: ' + err.message + '</p>';
            btn.disabled = false;
        }
    });

    // ── SSE close handler (not needed with raw EventSource) ─────

    // ── Init ───────────────────────────────────────────────────
    loadKeywords();
</script>
</body>
</html>
