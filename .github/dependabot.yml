version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      day: "1"
      time: "04:15"
      timezone: Europe/Vienna
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /.opencode
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
    groups:
      opencode-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Vienna
    open-pull-requests-limit: 5
