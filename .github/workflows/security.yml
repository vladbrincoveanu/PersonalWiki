name: Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python_audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Run pip audit
        run: |
          mkdir -p artifacts
          # PYSEC-2026-3740 (NLTK model-artifact path traversal) has no fix version.
          # The application does not use NLTK's model persistence APIs (TransitionParser,
          # AveragedPerceptron, PerceptronTagger, maxent params), so this vulnerability
          # is not exploitable in our code paths.
          pip-audit --requirement requirements.txt --format json --output artifacts/pip-audit.json --strict --ignore-vuln PYSEC-2026-3740

      - name: Upload pip audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-report
          path: artifacts/pip-audit.json
          if-no-files-found: ignore

  npm_audit:
    name: npm dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Run npm audit
        run: |
          mkdir -p artifacts
          npm audit --package-lock-only --audit-level=high --json > artifacts/npm-audit.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-report
          path: artifacts/npm-audit.json
          if-no-files-found: ignore

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  security_summary:
    name: Security summary
    if: always()
    needs: [python_audit, npm_audit, secret_scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a security job did not pass
        env:
          PYTHON_AUDIT: ${{ needs.python_audit.result }}
          NPM_AUDIT: ${{ needs.npm_audit.result }}
          SECRET_SCAN: ${{ needs.secret_scan.result }}
        run: |
          set -eu
          printf 'python_audit=%s npm_audit=%s secret_scan=%s\n' \
            "$PYTHON_AUDIT" "$NPM_AUDIT" "$SECRET_SCAN"
          if [ "$PYTHON_AUDIT" != success ] || \
             [ "$NPM_AUDIT" != success ] || \
             [ "$SECRET_SCAN" != success ]; then
            echo "::error::At least one required security job failed or was skipped."
            exit 1
          fi
