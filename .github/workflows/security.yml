name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          category: "/language:python"

  python_audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit Python dependencies
        run: |
          mkdir -p artifacts
          # requirements-dev.lock.txt pins every direct and transitive dependency;
          # the dev lock includes the runtime requirements and CI tooling.
          pip-audit --requirement requirements-dev.lock.txt \
            --format json \
            --output artifacts/pip-audit.json \
            --strict \
            --progress-spinner off

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-${{ github.run_id }}
          path: artifacts/pip-audit.json
          if-no-files-found: ignore

  npm_audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .opencode
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .opencode/package-lock.json

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Run high-severity npm audit
        run: |
          mkdir -p artifacts
          npm audit --audit-level=high --json > artifacts/npm-audit.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-${{ github.run_id }}
          path: .opencode/artifacts/npm-audit.json
          if-no-files-found: ignore

  security_gate:
    name: Security summary
    if: always()
    needs: [codeql, python_audit, npm_audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require all security checks to pass
        if: >-
          ${{
            needs.codeql.result != 'success' ||
            needs.python_audit.result != 'success' ||
            needs.npm_audit.result != 'success'
          }}
        run: |
          echo "codeql=${{ needs.codeql.result }}"
          echo "python-audit=${{ needs.python_audit.result }}"
          echo "npm-audit=${{ needs.npm_audit.result }}"
          exit 1

      - name: All security checks passed
        run: echo "Security gate passed."
