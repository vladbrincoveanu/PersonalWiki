name: Security

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python_audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Run pip audit
        run: |
          mkdir -p artifacts
          pip-audit --requirement requirements.txt --format json --output artifacts/pip-audit.json --strict

      - name: Upload pip audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pip-audit-report
          path: artifacts/pip-audit.json
          if-no-files-found: ignore

  npm_audit:
    name: npm dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Run npm audit
        run: |
          mkdir -p artifacts
          npm audit --package-lock-only --audit-level=high --json > artifacts/npm-audit.json

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-audit-report
          path: artifacts/npm-audit.json
          if-no-files-found: ignore

  secret_scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  security_summary:
    name: Security summary
    if: always()
    needs: [python_audit, npm_audit, secret_scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a security job did not pass
        env:
          PYTHON_AUDIT: ${{ needs.python_audit.result }}
          NPM_AUDIT: ${{ needs.npm_audit.result }}
          SECRET_SCAN: ${{ needs.secret_scan.result }}
        run: |
          set -eu
          printf 'python_audit=%s npm_audit=%s secret_scan=%s\n' \
            "$PYTHON_AUDIT" "$NPM_AUDIT" "$SECRET_SCAN"
          if [ "$PYTHON_AUDIT" != success ] || \
             [ "$NPM_AUDIT" != success ] || \
             [ "$SECRET_SCAN" != success ]; then
            echo "::error::At least one required security job failed or was skipped."
            exit 1
          fi
