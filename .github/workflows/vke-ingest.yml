name: VKE Ingest

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to ingest'
        required: true
        type: string
      vault:
        description: 'Obsidian vault path'
        required: false
        type: string
        default: './vault'
      type:
        description: 'Source type (generic, sec_10k, preprint)'
        required: false
        type: string
        default: 'generic'
      domain:
        description: 'Domain (academic, financial, news, social)'
        required: false
        type: string
        default: 'academic'

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build VKE
        run: dotnet build src/Vke.Full/Vke.Full.csproj -c Release

      - name: Run VKE Ingest
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          OBSIDIAN_VAULT_PATH: ${{ inputs.vault || './vault' }}
        run: |
          dotnet src/Vke.Full/bin/Release/net10.0/Vke.Full.dll \
            --url "${{ inputs.url }}" \
            --vault "${{ inputs.vault || './vault' }}" \
            --type "${{ inputs.type }}" \
            --domain "${{ inputs.domain }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wiki-output
          path: ${{ inputs.vault || './vault' }}/**/*.md
          retention-days: 30
