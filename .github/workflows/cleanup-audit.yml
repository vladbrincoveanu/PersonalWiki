name: Hallucination Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hallucination-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hallucination:
    name: Static audit (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run hallucination audit
        shell: bash
        run: |
          set -o pipefail
          python scripts/hallucination_remover.py --path . \
            | tee "$RUNNER_TEMP/hallucination-audit.txt"
          if grep -qv '^No hallucinations found\.$' "$RUNNER_TEMP/hallucination-audit.txt"; then
            echo '::warning::Audit findings are advisory; see the job log or artifact.'
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hallucination-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/hallucination-audit.txt
          if-no-files-found: ignore
