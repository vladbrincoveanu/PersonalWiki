name: Hallucination Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The audit must never push to a contributor branch.
permissions:
  contents: read

concurrency:
  group: hallucination-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hallucination:
    name: Static audit (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Run hallucination audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/hallucination_remover.py --path . \
            | tee artifacts/hallucination-audit.txt
          if grep -qv '^No hallucinations found\.$' artifacts/hallucination-audit.txt; then
            echo "::warning::Audit findings are advisory; see the uploaded artifact."
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hallucination-audit-${{ github.run_id }}
          path: artifacts/hallucination-audit.txt
          if-no-files-found: ignore
