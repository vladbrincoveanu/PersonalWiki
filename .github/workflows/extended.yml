name: Extended tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 6"

permissions:
  contents: read

concurrency:
  group: extended-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VAULT_PATH: ${{ github.workspace }}/.extended-vault
  INDEX_PATH: ${{ github.workspace }}/.extended-index
  PYTHONUNBUFFERED: "1"
  HF_HUB_OFFLINE: "0"
  TRANSFORMERS_OFFLINE: "0"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  extended:
    name: Extended tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.lock.txt
          python -m pip check

      - name: Prepare isolated test vault
        run: mkdir -p "$VAULT_PATH" "$INDEX_PATH"

      - name: Run the complete configured suite
        run: |
          mkdir -p artifacts
          python -m pytest -q --disable-warnings \
            --junitxml=artifacts/extended.xml

      - name: Upload extended test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extended-test-results-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
