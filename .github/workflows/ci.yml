name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VAULT_PATH: ${{ github.workspace }}/.ci-vault
  INDEX_PATH: ${{ github.workspace }}/.ci-index

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app.py pipeline.py config.py core ingesters vault scripts

      - name: Prepare test vault
        run: mkdir -p "$VAULT_PATH"

      - name: Run deterministic test suite
        run: python -m pytest -q --disable-warnings -m "not integration and not slow" tests

  extended:
    name: Extended model and integration tests
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare test vault
        run: mkdir -p "$VAULT_PATH"

      - name: Run extended test suite
        run: python -m pytest -q --disable-warnings tests

  docker:
    name: Docker smoke test
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VAULT_PATH: ${{ github.workspace }}/.ci-vault
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare smoke-test vault
        run: mkdir -p "$VAULT_PATH"

      - name: Build and start container
        run: docker compose up -d --build personalwiki

      - name: Wait for app
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:e2e

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop container
        if: always()
        run: docker compose down --remove-orphans
