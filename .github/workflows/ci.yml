name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PR regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app.py pipeline.py config.py core ingesters vault scripts

      - name: Run tests
        run: >-
          python -m pytest -q --disable-warnings
          tests/test_bm25_index.py
          tests/test_bm25_keys.py
          tests/test_mcp_search.py
          tests/test_vector_store.py
          tests/test_reranker_integration.py

  docker:
    name: Docker smoke test
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VAULT_PATH: ${{ runner.temp }}/personalwiki-vault
    steps:
      - uses: actions/checkout@v4

      - name: Prepare smoke-test vault
        run: mkdir -p "$VAULT_PATH"

      - name: Build and start container
        run: docker compose up -d --build personalwiki

      - name: Wait for app
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop container
        if: always()
        run: docker compose down --remove-orphans
