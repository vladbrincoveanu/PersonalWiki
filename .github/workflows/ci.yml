name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  VAULT_PATH: ${{ github.workspace }}/.ci-vault
  INDEX_PATH: ${{ github.workspace }}/.ci-index
  SENTRY_DSN: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SDK_DISABLED: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest-cov
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app.py pipeline.py config.py core ingesters vault scripts

      - name: Prepare test vault
        run: mkdir -p "$VAULT_PATH"

      - name: Run deterministic test suite
        run: |
          mkdir -p artifacts
          python -m pytest -q --disable-warnings \
            --cov=app \
            --cov=pipeline \
            --cov=config \
            --cov=core \
            --cov=ingesters \
            --cov=vault \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/python-coverage.xml \
            --cov-fail-under=60 \
            --junitxml=artifacts/python-junit.xml \
            -m "not integration and not slow" tests

      - name: Upload Python diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-reports-${{ github.run_id }}
          path: artifacts
          if-no-files-found: ignore

  quality:
    name: Python static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install Ruff
        run: python -m pip install ruff==0.16.5

      - name: Check Python correctness
        run: ruff check app.py pipeline.py config.py core ingesters vault scripts tests --select E9,F63,F7,F82

  extended:
    name: Extended model and integration tests
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare test vault
        run: mkdir -p "$VAULT_PATH"

      - name: Run extended test suite
        run: python -m pytest -q --disable-warnings tests

  docker:
    name: Docker smoke test
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VAULT_PATH: ${{ github.workspace }}/.ci-vault
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare smoke-test vault
        run: mkdir -p "$VAULT_PATH"

      - name: Build and start container
        run: docker compose up -d --build personalwiki

      - name: Wait for app
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:e2e

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop container
        if: always()
        run: docker compose down --remove-orphans

  summary:
    name: Required CI summary
    if: always()
    needs: [test, quality, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if a required job did not pass
        env:
          TEST: ${{ needs.test.result }}
          QUALITY: ${{ needs.quality.result }}
          DOCKER: ${{ needs.docker.result }}
        run: |
          set -eu
          printf 'test=%s quality=%s docker=%s\n' "$TEST" "$QUALITY" "$DOCKER"
          if [ "$TEST" != success ] || \
             [ "$QUALITY" != success ] || \
             [ "$DOCKER" != success ]; then
            echo "::error::At least one required CI job failed or was skipped."
            exit 1
          fi
