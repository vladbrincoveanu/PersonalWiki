name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Vke.sln

      - name: Build
        run: dotnet build Vke.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Vke.sln -c Release --no-build --verbosity normal

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t vke:${{ github.sha }} .

      - name: Run container
        run: docker-compose up -d

      - name: Wait for app
        run: sleep 5 && curl -f http://localhost:8080 || exit 1

      - name: Stop container
        run: docker-compose down
