name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# CI never needs to write to the repository, even for same-repository PRs.
permissions:
  contents: read

env:
  VAULT_PATH: ${{ github.workspace }}/.ci-vault
  INDEX_PATH: ${{ github.workspace }}/.ci-index
  PYTHONUNBUFFERED: "1"
  # Model-backed tests must not turn the required PR check into a network job.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  TOKENIZERS_PARALLELISM: "false"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install static-analysis tool
        run: python -m pip install --disable-pip-version-check ruff==0.12.10

      - name: Compile Python sources
        run: python -m compileall -q app.py pipeline.py config.py core ingesters vault scripts

      - name: Run production lint
        run: python -m ruff check app.py pipeline.py config.py core ingesters vault

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install direct dependencies and CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.lock.txt
          python -m pip check

      - name: Prepare isolated test vault
        run: mkdir -p "$VAULT_PATH" "$INDEX_PATH"

      - name: Run deterministic tests with coverage
        run: |
          mkdir -p artifacts
          python -m pytest -q --disable-warnings \
            -m "not integration and not slow" \
            --cov=app --cov=pipeline --cov=core --cov=ingesters --cov=vault \
            --cov-fail-under=60 \
            --cov-report=term-missing \
            --cov-report=xml:artifacts/coverage.xml \
            --junitxml=artifacts/pytest.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-test-results-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

  integration:
    name: Integration tests
    # These tests may use live services, browsers, or external APIs. Keep the
    # required PR gate deterministic; run this job explicitly from the Actions
    # tab when an integration pass is needed. The scheduled extended workflow
    # exercises the complete suite automatically.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Browser tests need a separately provisioned browser job; this job covers
      # the marked application integrations without downloading Chromium.
      SKIP_PLAYWRIGHT: "1"
      HF_HUB_OFFLINE: "0"
      TRANSFORMERS_OFFLINE: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.lock.txt

      - name: Install OCR runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.lock.txt
          python -m pip check

      - name: Prepare isolated test vault
        run: mkdir -p "$VAULT_PATH" "$INDEX_PATH"

      - name: Run marked integration tests
        run: |
          mkdir -p artifacts
          python -m pytest -q --disable-warnings \
            -m integration \
            --junitxml=artifacts/integration.xml

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-integration-results-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore

  docker:
    name: Container check
    needs: [static, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      VAULT_PATH: ${{ github.workspace }}/.ci-vault
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prepare isolated smoke-test vault
        run: mkdir -p "$VAULT_PATH"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start container
        run: docker compose up -d --build personalwiki

      - name: Wait for application health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8010/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Verify application endpoints
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8010/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8010/docs >/dev/null

      - name: Show container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop container
        if: always()
        run: docker compose down --remove-orphans --volumes

  gate:
    name: CI gate
    if: always()
    needs: [static, test, integration, docker]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all required checks to pass
        if: >-
          ${{
            needs.static.result != 'success' ||
            needs.test.result != 'success' ||
            needs.docker.result != 'success' ||
            (needs.integration.result != 'success' && needs.integration.result != 'skipped')
          }}
        run: |
          echo "static=${{ needs.static.result }}"
          echo "test=${{ needs.test.result }}"
          echo "integration=${{ needs.integration.result }}"
          echo "docker=${{ needs.docker.result }}"
          exit 1

      - name: All required checks passed
        run: echo "CI gate passed."
